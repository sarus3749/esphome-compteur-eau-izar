# =============================================================================
#  Lecteur de compteur d'eau Diehl Altair + module radio IZAR RC
#  wM-Bus mode T1, 868,95 MHz, protocole Diehl PRIOS (driver "izar")
#
#  Matériel : Diymore ESP32 Mini (= D1 mini ESP32 / MH-ET LIVE MiniKit,
#             ESP32-WROOM-32, USB CH9102F : installer le pilote CH9102/CH343
#             sous Windows si le port USB n'apparaît pas)
#             + module CC1101 868 MHz (avec antenne 868 MHz, pas 433 !)
#
#  Composant : wmbus de SzczepanLeon/esphome-components, branche version_3
#  (framework Arduino), utilisé tel quel depuis le dépôt d'origine. C'est la
#  branche CC1101 maintenue : bibliothèque SmartRC 3.0.2 et correctif de
#  réception des trames T1 (PR #444 et #463 amont), compatible ESPHome 2026.11
#  (PR #482).
#
#  Câblage (voir docs/schema-cablage-esp32-cc1101.svg) : tous les fils
#  sur le même côté de la carte.
#    CC1101      ESP32 Mini (sérigraphie)   Emplacement (colonnes depuis l'USB-C)
#    VCC   ----> 3V3                        rangée int. côté RST, 3e  (JAMAIS 5 V)
#    GND   ----> GND                        rangée ext. côté RST, 10e
#    MOSI  ----> IO23                       rangée int. côté RST, 5e
#    SCLK  ----> IO18                       rangée int. côté RST, 7e
#    MISO  ----> IO19                       rangée int. côté RST, 6e
#    GDO2  ----> IO33                       rangée ext. côté RST, 6e (indispensable en v4)
#    GDO0  ----> IO26                       rangée int. côté RST, 8e
#    CSN   ----> IO5                        rangée int. côté RST, 4e
# =============================================================================

substitutions:
  name: compteur-eau
  friendly_name: Compteur eau
  # Identifiant radio du compteur, calculé depuis le numéro imprimé sur le
  # compteur (H21CA112674 : 0x20000000 + 21112674 = 0x21422762), règle du
  # driver izar de wmbusmeters. A confirmer dans les logs.
  meter_id: "0x21422762"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Le composant wmbus inclut <WiFiClient.h> et <WiFiUdp.h> : depuis 2026.11,
  # ESPHome ne compile plus les bibliothèques Arduino non demandées.
  libraries:
    - WiFi

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
  # Compilation via PlatformIO : depuis 2026.11, ESPHome compile l'ESP32 avec
  # ESP-IDF directement et refuse les bibliothèques sans library.json, comme
  # wmbus-drivers utilisée par le composant wmbus (« Invalid PIO library »).
  toolchain: platformio

external_components:
  # Composant wmbus : copie de SzczepanLeon/esphome-components (branche
  # version_3) dans components/wmbus, avec seulement trois lignes de journal
  # ajoutées dans rf_cc1101.cpp (burst rejetée, trame abandonnée, fréquence).
  # refresh: always : sinon ESPHome garde une copie en cache.
  - source: github://sarus3749/esphome-compteur-eau-izar@main
    components: [wmbus]
    refresh: always

logger:
  # Niveau VERBOSE uniquement pour la radio : montre pour chaque trame reçue
  # sa longueur, RSSI/LQI, les octets bruts et le bloc dont le CRC échoue.
  # Le reste reste en DEBUG.
  level: VERBOSE
  logs:
    mbus: VERBOSE
    rxLoop: VERBOSE
    crc: VERBOSE
    3of6: VERBOSE
    wmbus: DEBUG
    wifi: DEBUG
    api: DEBUG
    api.connection: DEBUG
    sensor: DEBUG
    pulse_counter: DEBUG
    web_server: DEBUG
    web_server_idf: DEBUG
    web_server_base: DEBUG
    mdns: DEBUG
    network: DEBUG
    time: DEBUG
    safe_mode: DEBUG
    esphome.ota: DEBUG
    app: DEBUG
    component: DEBUG
    preferences: DEBUG
    status: DEBUG
    binary_sensor: DEBUG
    uptime.sensor: DEBUG
    wifi_signal.sensor: DEBUG
    homeassistant.time: DEBUG
    button: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Mises à jour OTA chiffrées avec la même clé que l'API (ESPHome ≥ 2026.11).
    encryption: {}

wifi:
  ssid: !secret wifi-iot_ssid
  password: !secret wifi-iot_password
  # Le mode d'économie d'énergie WiFi peut rendre la carte injoignable pour les
  # connexions entrantes (mise à jour sans fil : « No route to host »).
  power_save_mode: none

web_server:
  version: 3

# Obligatoire pour le composant wmbus (horodatage des trames).
time:
  - platform: homeassistant

# ---------------------------------------------------------------- Radio ------
wmbus:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  cs_pin:
    number: GPIO5   # broche de démarrage, mais tirée au niveau haut : sans risque
    ignore_strapping_warning: true
  # allow_other_uses : les deux broches sont aussi lues par les compteurs
  # d'impulsions de diagnostic plus bas (lecture seule, sans effet sur la radio).
  gdo0_pin:
    number: GPIO26
    allow_other_uses: true
  gdo2_pin:
    number: GPIO33
    allow_other_uses: true
  frequency: 868.950
  # Journalise les trames des compteurs non configurés (voisins compris) avec
  # leur ID : utile pour trouver l'ID du compteur, à passer à false ensuite.
  log_unknown: true

# -------------------------------------------------------------- Compteur -----
sensor:
  # Pas de clé : le driver izar connaît les clés PRIOS par défaut de Diehl.
  # Si les logs signalent un échec de décodage PRIOS, ajouter
  # key: !secret cle_compteur_eau (clé fournie par le distributeur).
  - platform: wmbus
    meter_id: ${meter_id}
    type: izar
    add_prefix: false
    # Index total : c'est LE capteur à ajouter dans Paramètres > Tableaux de
    # bord > Énergie > Consommation d'eau.
    total_water_m3:
      name: "Index eau"
      # Le module Izar émet toutes les 8 à 32 s : on évite d'inonder la
      # base HA tout en publiant immédiatement tout changement d'index.
      filters:
        - or:
            - delta: 0.0005
            - heartbeat: 5min
    last_month_total_water_m3:
      name: "Index fin du mois précédent"
      state_class: total
      icon: "mdi:calendar-month"
    remaining_battery_life_y:
      name: "Autonomie pile module radio"
      entity_category: diagnostic
    transmit_period_s:
      name: "Période d'émission"
      entity_category: diagnostic
    current_alarms:
      name: "Alarmes en cours"
    previous_alarms:
      name: "Alarmes précédentes"
      entity_category: diagnostic
    rssi:
      name: "Signal radio compteur"

  # Diagnostic radio : impulsions par minute sur les sorties du CC1101.
  # GDO2 monte à chaque début de trame détecté, GDO0 quand la trame remplit la
  # mémoire tampon. Si GDO0 compte mais pas GDO2 : fil GDO2 -> IO33 à vérifier.
  - platform: pulse_counter
    name: "Radio GDO2 (débuts de trame)"
    pin:
      number: GPIO33
      allow_other_uses: true
    unit_of_measurement: "/min"
    update_interval: 60s
    entity_category: diagnostic
  - platform: pulse_counter
    name: "Radio GDO0 (données reçues)"
    pin:
      number: GPIO26
      allow_other_uses: true
    unit_of_measurement: "/min"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Statut"

button:
  - platform: restart
    name: "Redémarrer"
    entity_category: diagnostic
