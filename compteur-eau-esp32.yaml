# =============================================================================
#  Lecteur de compteur d'eau Diehl Altair + module radio IZAR RC
#  wM-Bus mode T1, 868,95 MHz, protocole Diehl PRIOS (driver "izar")
#
#  Matériel : Diymore ESP32 Mini (= D1 mini ESP32 / MH-ET LIVE MiniKit,
#             ESP32-WROOM-32, USB CH9102F : installer le pilote CH9102/CH343
#             sous Windows si le port USB n'apparaît pas)
#             + module CC1101 868 MHz (avec antenne 868 MHz, pas 433 !)
#
#  Composant : wmbus de SzczepanLeon/esphome-components, branche version_4
#  (framework Arduino), copié dans ce dépôt avec deux correctifs pour
#  ESPHome 2026.11 (voir components/wmbus/CORRECTIF.md). Seuls les drivers
#  izar et unknown sont inclus.
#
#  Câblage (voir docs/schema-cablage-esp32-cc1101.svg) : tous les fils
#  sur le même côté de la carte.
#    CC1101      ESP32 Mini (sérigraphie)   Emplacement (colonnes depuis l'USB-C)
#    VCC   ----> 3V3                        rangée int. côté RST, 3e  (JAMAIS 5 V)
#    GND   ----> GND                        rangée ext. côté RST, 10e
#    MOSI  ----> IO23                       rangée int. côté RST, 5e
#    SCLK  ----> IO18                       rangée int. côté RST, 7e
#    MISO  ----> IO19                       rangée int. côté RST, 6e
#    GDO2  ----> IO33                       rangée ext. côté RST, 6e (indispensable en v4)
#    GDO0  ----> IO26                       rangée int. côté RST, 8e
#    CSN   ----> IO5                        rangée int. côté RST, 4e
# =============================================================================

substitutions:
  name: compteur-eau
  friendly_name: Compteur eau
  # Identifiant radio du compteur. A VERIFIER dans les logs au premier
  # démarrage (voir « Trouver l'ID du compteur » dans le README). Valeur de
  # départ : le TxS/N imprimé sur le module IZAR RC.
  meter_id: "0x13903750"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

external_components:
  # refresh: always : toujours la dernière version de ce dépôt (sinon ESPHome
  # garde une copie en cache, que « Clean Build Files » n'efface pas).
  - source: github://sarus3749/esphome-compteur-eau-izar@main
    components: [wmbus]
    refresh: always

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Mises à jour OTA chiffrées avec la même clé que l'API (ESPHome ≥ 2026.11).
    encryption: {}

wifi:
  ssid: !secret wifi-iot_ssid
  password: !secret wifi-iot_password

web_server:
  version: 3

# Obligatoire pour le composant wmbus (horodatage des trames).
time:
  - platform: homeassistant

# ---------------------------------------------------------------- Radio ------
wmbus:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  cs_pin:
    number: GPIO5   # broche de démarrage, mais tirée au niveau haut : sans risque
    ignore_strapping_warning: true
  gdo0_pin: GPIO26
  gdo2_pin: GPIO33
  frequency: 868.950
  sync_mode: true
  all_drivers: false
  # Journalise toutes les trames reçues (compteurs voisins compris) avec leur
  # ID : utile pour trouver l'ID du compteur, à passer à false ensuite.
  log_all: true

# -------------------------------------------------------------- Compteur -----
sensor:
  # Pas de clé : le driver izar connaît les clés PRIOS par défaut de Diehl.
  # Si les logs affichent "(izar) Decoding PRIOS data failed", ajouter
  # key: !secret cle_compteur_eau (clé fournie par le distributeur).
  - platform: wmbus
    meter_id: ${meter_id}
    type: izar
    sensors:
      # Index total : c'est LE capteur à ajouter dans Paramètres > Tableaux de
      # bord > Énergie > Consommation d'eau.
      - name: "Index eau"
        field: "total"
        unit_of_measurement: "m³"
        device_class: water
        state_class: total_increasing
        accuracy_decimals: 3
        icon: "mdi:water"
        # Le module Izar émet toutes les 8 à 32 s : on évite d'inonder la
        # base HA tout en publiant immédiatement tout changement d'index.
        filters:
          - or:
              - delta: 0.0005
              - heartbeat: 5min
      - name: "Index fin du mois précédent"
        field: "last_month_total"
        unit_of_measurement: "m³"
        device_class: water
        state_class: total
        accuracy_decimals: 3
        icon: "mdi:calendar-month"
      - name: "Autonomie pile module radio"
        field: "remaining_battery_life"
        unit_of_measurement: "y"
        accuracy_decimals: 1
        entity_category: diagnostic
        icon: "mdi:battery-clock"
      - name: "Période d'émission"
        field: "transmit_period"
        unit_of_measurement: "s"
        entity_category: diagnostic
      - name: "Signal radio compteur"
        field: "rssi"
        unit_of_measurement: "dBm"
        device_class: signal_strength
        state_class: measurement
        accuracy_decimals: 0
        entity_category: diagnostic

  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wmbus
    meter_id: ${meter_id}
    type: izar
    sensors:
      - name: "Alarmes en cours"
        field: "current_alarms"
        icon: "mdi:alert"
      - name: "Alarmes précédentes"
        field: "previous_alarms"
        entity_category: diagnostic
      - name: "Date du relevé mensuel"
        field: "last_month_measure_date"
        entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Statut"

button:
  - platform: restart
    name: "Redémarrer"
    entity_category: diagnostic
