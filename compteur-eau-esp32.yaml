# =============================================================================
#  Lecteur de compteur d'eau Diehl Altair + module radio IZAR RC
#  wM-Bus mode T1, 868,95 MHz, protocole Diehl PRIOS (driver "izar")
#
#  Matériel : Diymore ESP32 Mini (= D1 mini ESP32 / MH-ET LIVE MiniKit,
#             ESP32-WROOM-32, USB CH9102F : installer le pilote CH9102/CH343
#             sous Windows si le port USB n'apparaît pas)
#             + module CC1101 868 MHz (avec antenne 868 MHz, pas 433 !)
#
#  Composant : wmbus de SzczepanLeon/esphome-components, branche version_3
#  (framework Arduino), utilisé tel quel depuis le dépôt d'origine. C'est la
#  branche CC1101 maintenue : bibliothèque SmartRC 3.0.2 et correctif de
#  réception des trames T1 (PR #444 et #463 amont), compatible ESPHome 2026.11
#  (PR #482).
#
#  Câblage (voir docs/schema-cablage-esp32-cc1101.svg) : tous les fils
#  sur le même côté de la carte.
#    CC1101      ESP32 Mini (sérigraphie)   Emplacement (colonnes depuis l'USB-C)
#    VCC   ----> 3V3                        rangée int. côté RST, 3e  (JAMAIS 5 V)
#    GND   ----> GND                        rangée ext. côté RST, 10e
#    MOSI  ----> IO23                       rangée int. côté RST, 5e
#    SCLK  ----> IO18                       rangée int. côté RST, 7e
#    MISO  ----> IO19                       rangée int. côté RST, 6e
#    GDO2  ----> IO33                       rangée ext. côté RST, 6e (indispensable en v4)
#    GDO0  ----> IO26                       rangée int. côté RST, 8e
#    CSN   ----> IO5                        rangée int. côté RST, 4e
# =============================================================================

substitutions:
  name: compteur-eau
  friendly_name: Compteur eau
  # Identifiant radio du compteur. A VERIFIER dans les logs au premier
  # démarrage (voir « Trouver l'ID du compteur » dans le README). Valeur de
  # départ : le TxS/N imprimé sur le module IZAR RC.
  meter_id: "0x13903750"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

external_components:
  - source: github://SzczepanLeon/esphome-components@version_3
    components: [wmbus]
    refresh: always

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Mises à jour OTA chiffrées avec la même clé que l'API (ESPHome ≥ 2026.11).
    encryption: {}

wifi:
  ssid: !secret wifi-iot_ssid
  password: !secret wifi-iot_password

web_server:
  version: 3

# Obligatoire pour le composant wmbus (horodatage des trames).
time:
  - platform: homeassistant

# ---------------------------------------------------------------- Radio ------
wmbus:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  cs_pin:
    number: GPIO5   # broche de démarrage, mais tirée au niveau haut : sans risque
    ignore_strapping_warning: true
  gdo0_pin: GPIO26
  gdo2_pin: GPIO33
  frequency: 868.950
  # Journalise les trames des compteurs non configurés (voisins compris) avec
  # leur ID : utile pour trouver l'ID du compteur, à passer à false ensuite.
  log_unknown: true

# -------------------------------------------------------------- Compteur -----
sensor:
  # Pas de clé : le driver izar connaît les clés PRIOS par défaut de Diehl.
  # Si les logs signalent un échec de décodage PRIOS, ajouter
  # key: !secret cle_compteur_eau (clé fournie par le distributeur).
  - platform: wmbus
    meter_id: ${meter_id}
    type: izar
    add_prefix: false
    # Index total : c'est LE capteur à ajouter dans Paramètres > Tableaux de
    # bord > Énergie > Consommation d'eau.
    total_water_m3:
      name: "Index eau"
      # Le module Izar émet toutes les 8 à 32 s : on évite d'inonder la
      # base HA tout en publiant immédiatement tout changement d'index.
      filters:
        - or:
            - delta: 0.0005
            - heartbeat: 5min
    last_month_total_water_m3:
      name: "Index fin du mois précédent"
      state_class: total
      icon: "mdi:calendar-month"
    remaining_battery_life_y:
      name: "Autonomie pile module radio"
      entity_category: diagnostic
    transmit_period_s:
      name: "Période d'émission"
      entity_category: diagnostic
    current_alarms:
      name: "Alarmes en cours"
    previous_alarms:
      name: "Alarmes précédentes"
      entity_category: diagnostic
    rssi:
      name: "Signal radio compteur"

  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Statut"

button:
  - platform: restart
    name: "Redémarrer"
    entity_category: diagnostic
