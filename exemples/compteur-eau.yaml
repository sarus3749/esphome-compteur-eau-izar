# Compteur d'eau Izar : seules les substitutions sont propres à votre installation.
# La configuration complète vient du dépôt GitHub .
substitutions:
  name: compteur-eau            # nom réseau (minuscules, tirets)
  friendly_name: Compteur eau   # nom de l'appareil dans Home Assistant
  meter_id: "0x21422762"        # ID radio du compteur, à confirmer dans les logs

packages:
  compteur:
    url: https://github.com/sarus3749/esphome-compteur-eau-izar
    ref: main
    files: [compteur-eau-esp32.yaml]
    refresh: always   # sinon ESPHome garde la configuration en cache 24 h
